server {
    listen 80;
    server_name _;
    
    # Frontend
    root /var/www/html;
    index index.html;

    # Image proxy for posters (bypass hotlink/CORS)
    location /img-proxy/ {
        resolver 8.8.8.8;
        proxy_pass https://$arg_url;
        proxy_set_header Referer "";
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_hide_header Set-Cookie;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # API requests
    location /api/ {
        alias /var/www/api/api/;
        try_files $uri $uri/ /api/index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    # Frontend SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Block ad abuse: deny notifications/push/popups, tracking topics from any embedded content
        add_header Permissions-Policy "notifications=(), push=(), geolocation=(), microphone=(), camera=(), browsing-topics=(), interest-cohort=(), midi=(), payment=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    client_max_body_size 50M;
}
