version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: streamify-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: streamify_db
      MYSQL_USER: streamify_user
      MYSQL_PASSWORD: rimbamobile2
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend-vps/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: streamify-php
    restart: unless-stopped
    volumes:
      - ./backend-vps:/var/www/api
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: streamify-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dist:/var/www/html
      - ./backend-vps:/var/www/api
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  mysql_data:
